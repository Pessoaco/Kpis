<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel compartilhado · IALINK</title>
<!-- Link compartilhado — v2 · por @pessoaco
     Abre SEM login a "foto" de um painel (fluxo n8n Compartilhar_Link_Paineis, webhook compartilhar-link).
     A foto nao tem codigo nem os outros dados: quem abre nao troca periodo, representada ou vendedor.
     v2: a foto passa a ser a PAGINA INTEIRA (antes ficava num quadro/iframe e a impressao saia quebrada:
     1a folha so com o aviso, relatorio cortado, folha em branco no fim). Antes de mostrar, a foto e limpa de novo
     (sem scripts, sem iframes, sem atributos on*, sem javascript:). Imprime igual ao painel (mesmas regras de impressao).
     O link vence em 30 dias. -->
<style>
  :root{--bg:#f5f5f7;--ink:#1d1d1f;--soft:#5b5b66;--hair:#dcdce3;--card:#fff}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#17171b;--ink:#ececf1;--soft:#a9a9b5;--hair:#33333b;--card:#202027} }
  :root[data-theme="dark"]{--bg:#17171b;--ink:#ececf1;--soft:#a9a9b5;--hair:#33333b;--card:#202027}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif}
  .msg{max-width:560px;margin:14vh 16px;margin-left:auto;margin-right:auto;padding:22px;background:var(--card);border:1px solid var(--hair);border-radius:12px;text-align:center}
</style>
</head>
<body>
<div id="carregando" class="msg">⏳ Abrindo o painel compartilhado…</div>

<script>
const WEBHOOK = "https://auto.ialink.com.br/webhook/compartilhar-link";
const DIREITOS = "© IALINK · por @pessoaco — Conteúdo confidencial. Proibida a cópia, reprodução ou distribuição, total ou parcial, dos dados e do formato deste relatório, por qualquer meio, inclusive ferramentas de inteligência artificial (Lei 9.610/98).";
const VERSAO = "v2";

function esc(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(iso, comHora){
  const d = new Date(iso); if(isNaN(d.getTime())) return '';
  return d.toLocaleString('pt-BR', comHora ? {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'2-digit',year:'2-digit'});
}
function erro(txt){ document.getElementById('carregando').innerHTML = '⚠ ' + esc(txt) + '<br><br><span style="font-size:12px;color:var(--soft)">' + esc(DIREITOS) + '</span>'; }
async function descompacta(b64){
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

// limpa a foto de novo (seguranca em dobro) e monta a pagina final
function montaPagina(html, r){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,noscript,iframe,frame,object,embed,applet,form,meta[http-equiv],template').forEach(e => e.remove());
  doc.querySelectorAll('*').forEach(e => {
    Array.from(e.attributes).forEach(a => {
      if(/^on/i.test(a.name) || a.name === 'contenteditable' || a.name === 'srcdoc') e.removeAttribute(a.name);
      else if((a.name === 'href' || a.name === 'src' || a.name === 'action' || a.name === 'formaction') && /^\s*(javascript|vbscript):/i.test(a.value)) e.removeAttribute(a.name);
    });
    if(e.tagName === 'A' && e.getAttribute('href')){ e.setAttribute('target','_blank'); e.setAttribute('rel','noopener'); }
  });
  const head = doc.head || doc.documentElement.insertBefore(doc.createElement('head'), doc.body);
  const meta = doc.createElement('meta'); meta.setAttribute('name','robots'); meta.setAttribute('content','noindex, nofollow'); head.appendChild(meta);
  const t = doc.createElement('title'); doc.querySelectorAll('title').forEach(x => x.remove()); t.textContent = (r.titulo || 'Painel') + ' · compartilhado'; head.appendChild(t);
  const st = doc.createElement('style');
  st.textContent =
    '*{-webkit-user-select:none!important;user-select:none!important}' +
    '.ial-topo{all:initial;display:block;box-sizing:border-box;max-width:1400px;margin:0 auto 10px;padding:10px 16px;font:13px/1.45 Arial,Helvetica,sans-serif;color:#1d1d1f;background:#fff7e0;border-bottom:1px solid #e8d9a8}' +
    '.ial-topo b{color:#2b4a8b}.ial-topo .ial-l1{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}' +
    '.ial-topo .ial-peq{font-size:12px;color:#5b5b66}.ial-topo .ial-dir{display:block;margin-top:5px;font-size:11.5px;color:#6b4e00}' +
    '.ial-topo button{all:initial;margin-left:auto;cursor:pointer;font:600 12.5px Arial,sans-serif;color:#fff;background:#2b4a8b;border-radius:7px;padding:5px 12px}' +
    '.ial-rodape{all:initial;display:block;box-sizing:border-box;max-width:1400px;margin:14px auto 20px;padding:0 16px;font:11.5px/1.45 Arial,Helvetica,sans-serif;color:#6b6b75}' +
    '@media print{.ial-topo{padding:0 0 6px;margin:0 0 6px;background:none;border-bottom:1px solid #ccc}.ial-topo button{display:none!important}.ial-rodape{padding:0;margin-top:8px}}';
  head.appendChild(st);
  const topo = doc.createElement('div'); topo.className = 'ial-topo';
  topo.innerHTML = '<div class="ial-l1"><span>📌 <b>' + esc(r.titulo || 'Painel') + '</b></span>' +
    '<span class="ial-peq">Dados de ' + esc(fmt(r.criado_em, true)) + (r.criado_por ? ' · compartilhado por ' + esc(r.criado_por) : '') + ' · link vale até ' + esc(fmt(r.expira_em)) + ' · não é o painel ao vivo</span>' +
    '<button type="button" id="ial-imprimir">🖨️ Imprimir</button></div><span class="ial-dir">' + esc(DIREITOS) + '</span>';
  const rod = doc.createElement('div'); rod.className = 'ial-rodape';
  rod.textContent = DIREITOS + ' · Link compartilhado · versão ' + VERSAO + ' · por @pessoaco';
  const body = doc.body || doc.documentElement.appendChild(doc.createElement('body'));
  body.insertBefore(topo, body.firstChild);
  body.appendChild(rod);
  return '<!doctype html>' + doc.documentElement.outerHTML;
}

(async function(){
  const t = new URLSearchParams(location.search).get('t') || '';
  if(!/^[0-9a-f]{16,64}$/i.test(t)){ erro('Link incompleto. Peça o link de novo a quem compartilhou.'); return; }
  let r;
  try {
    const resp = await fetch(WEBHOOK, { method: 'POST', body: new URLSearchParams({ acao: 'abrir', token: t }), cache: 'no-store' });
    r = await resp.json();
  } catch(e){ erro('Sem resposta do servidor. Verifique a internet e tente de novo.'); return; }
  if(!r || !r.ok){ erro((r && r.erro) || 'Link não encontrado.'); return; }
  let pagina;
  try { pagina = montaPagina(await descompacta(r.conteudo || ''), r); } catch(e){ erro('Não deu para abrir este link. Peça um link novo.'); return; }
  // a foto vira a pagina inteira (assim a impressao sai igual ao painel, em folhas certas)
  document.open(); document.write(pagina); document.close();
  const bloqueia = e => e.preventDefault();
  document.addEventListener('contextmenu', bloqueia);
  document.addEventListener('copy', bloqueia);
  document.addEventListener('cut', bloqueia);
  document.addEventListener('dragstart', bloqueia);
  const b = document.getElementById('ial-imprimir');
  if(b) b.addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
