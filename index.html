<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indicadores</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a78d6'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --ground:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-soft:#52514e; --ink-faint:#898781; --hair:#e1e0d9;
    --series-previsto:#2a78d6;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.045);
    --radius:9px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-soft:#c3c2b7; --ink-faint:#898781; --hair:#2c2c2a;
    --series-previsto:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 5px 16px rgba(0,0,0,.26);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.48;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 60px}
  h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-.01em;margin:0 0 6px}
  .sub{font-size:.85rem;color:var(--ink-soft);margin:0 0 28px}
  .lista{display:flex;flex-direction:column;gap:12px}
  .item{display:block;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;text-decoration:none;color:var(--ink);transition:border-color .15s}
  .item:hover{border-color:var(--series-previsto)}
  .item .nome{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
  .item .nome .seta{color:var(--series-previsto);font-weight:400}
  .item .desc{font-size:.8rem;color:var(--ink-soft);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Indicadores</h1>
  <p class="sub">Escolha o indicador que você quer abrir.</p>
  <div class="lista">
    <a class="item" href="prazo-entrega/">
      <div class="nome">Prazo de Entrega <span class="seta">→</span></div>
      <div class="desc">Prazo prometido x real, por representada — indicador pra apresentação/PDF.</div>
    </a>
  </div>
</div>
</body>
</html>
