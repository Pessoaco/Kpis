<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indicadores - Prazo de Entrega</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a78d6'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --ground:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-soft:#52514e; --ink-faint:#898781; --hair:#e1e0d9; --axis:#c3c2b7;
    --series-previsto:#2a78d6; --series-efetivo:#eb6834;
    --good:#0ca30c; --critical:#d03b3b;
    --good-bg:#e9f7e9; --good-edge:#9bd89b;
    --critical-bg:#fbeaea; --critical-edge:#e9a3a3;
    --bnz-bg:#e3edf7; --bnz-ink:#1f4e8a; --bnz-edge:#2a78d6;
    --ciaplac-bg:#fbe9de; --ciaplac-ink:#8a3f1f; --ciaplac-edge:#eb6834;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.045);
    --radius:9px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-soft:#c3c2b7; --ink-faint:#898781; --hair:#2c2c2a; --axis:#383835;
    --series-previsto:#3987e5; --series-efetivo:#d95926;
    --good:#0ca30c; --critical:#e66767;
    --good-bg:#132414; --good-edge:#2c5c2e;
    --critical-bg:#2c1414; --critical-edge:#6e2c2c;
    --bnz-bg:#12233a; --bnz-ink:#7fb2e8; --bnz-edge:#3987e5;
    --ciaplac-bg:#3a1f12; --ciaplac-ink:#f0a97f; --ciaplac-edge:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 5px 16px rgba(0,0,0,.26);
  }}
  :root[data-theme="dark"]{
    --ground:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-soft:#c3c2b7; --ink-faint:#898781; --hair:#2c2c2a; --axis:#383835;
    --series-previsto:#3987e5; --series-efetivo:#d95926;
    --good:#0ca30c; --critical:#e66767;
    --good-bg:#132414; --good-edge:#2c5c2e;
    --critical-bg:#2c1414; --critical-edge:#6e2c2c;
    --bnz-bg:#12233a; --bnz-ink:#7fb2e8; --bnz-edge:#3987e5;
    --ciaplac-bg:#3a1f12; --ciaplac-ink:#f0a97f; --ciaplac-edge:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 5px 16px rgba(0,0,0,.26);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;line-height:1.48;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 60px}

  .masthead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-bottom:8px;border-bottom:3px solid var(--ink)}
  .masthead h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(1.05rem,4vw,1.5rem);letter-spacing:-.01em;margin:0}
  .masthead h1 span{color:var(--ink-soft);font-weight:600}
  .meta{font-size:.72rem;color:var(--ink-soft)}
  .tagline{margin:6px 0 0;font-size:.78rem;color:var(--ink-soft);font-style:italic}
  .nav-voltar{display:inline-block;margin-bottom:8px;font-family:"Archivo",sans-serif;font-weight:600;font-size:.76rem;color:var(--series-previsto);text-decoration:none}
  .nav-voltar:hover{text-decoration:underline}

  section.card{margin-top:20px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .card h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.05rem;margin:0 0 3px}

  .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--surface)}
  .seg button{font:inherit;font-family:"Archivo",sans-serif;font-weight:600;font-size:.76rem;padding:6px 13px;border:0;border-left:1px solid var(--hair);background:transparent;color:var(--ink-soft);cursor:pointer}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--series-previsto);color:#fff}
  .seg.empresa button.on{color:#fff}
  .seg.empresa button[data-emp=""].on{background:var(--series-previsto)}
  .seg.empresa button[data-emp="CIAPLAC"].on{background:var(--ciaplac-edge)}
  .seg.empresa button[data-emp="BNZ METAIS"].on{background:var(--bnz-edge)}
  .statusbar{font-size:.72rem;color:var(--ink-faint);margin-left:auto}
  .busca-cliente{font:inherit;font-size:.76rem;padding:6px 12px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink);min-width:280px}
  .btn-imprimir-icone{font-size:1.05rem;line-height:1;padding:5px 9px;border:1px solid var(--hair);border-radius:7px;background:var(--surface);cursor:pointer}
  .btn-imprimir-icone:hover{background:var(--ground)}
  .busca-cliente::placeholder{color:var(--ink-faint)}
  .resumo-cliente{display:flex;gap:16px;flex-wrap:wrap;font-size:.74rem;color:var(--ink-soft);font-weight:600;margin:-2px 0 10px}
  .resumo-cliente span.critical{color:var(--critical)}
  .resumo-cliente span.good{color:var(--good)}

  .stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .stat{position:relative;border:1px solid var(--hair);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:3px}
  .stat.critical,.stat.good{padding-top:28px}
  .stat.critical{background:var(--critical-bg);border-color:var(--critical-edge)}
  .stat.good{background:var(--good-bg);border-color:var(--good-edge)}
  .stat .k{font-family:"Archivo",sans-serif;font-weight:600;font-size:.63rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
  .stat .v{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat.critical .v{color:var(--critical)}
  .stat.good .v{color:var(--good)}
  .stat .note{font-size:.68rem;color:var(--ink-faint)}
  .stat .v2{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .curva-a-linhas{display:flex;flex-direction:column;gap:4px;margin:3px 0}
  .curva-a-linhas .linha{display:flex;align-items:center;gap:6px;font-family:"Archivo",sans-serif;font-weight:600;font-size:.76rem;color:var(--ink-soft)}
  .curva-a-linhas .pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:.68rem;padding:2px 8px;border-radius:999px;color:#fff}
  .curva-a-linhas .pill.good{background:var(--good)}
  .curva-a-linhas .pill.critical{background:var(--critical)}
  .stat-badge{position:absolute;top:9px;right:10px;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:.66rem;padding:2px 8px;border-radius:999px;color:#fff}
  .stat.critical .stat-badge{background:var(--critical)}
  .stat.good .stat-badge{background:var(--good)}
  .stat-bar{height:4px;border-radius:3px;background:var(--hair);overflow:hidden;margin-top:3px}
  .stat-bar>span{display:block;height:100%;border-radius:3px}
  .stat.critical .stat-bar>span{background:var(--critical)}
  .stat.good .stat-bar>span{background:var(--good)}

  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.74rem;color:var(--ink-soft);margin-bottom:6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:none}

  .chart-wrap{position:relative;overflow-x:auto}
  svg.chart{display:block}
  .grid-line{stroke:var(--hair);stroke-width:1}
  .axis-line{stroke:var(--axis);stroke-width:1}
  .axis-label{fill:var(--ink-faint);font-size:10px;font-family:"IBM Plex Sans",sans-serif}
  .linha-evolucao{fill:none;stroke:var(--good);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .area-evolucao{fill:var(--good);opacity:.1;stroke:none}
  .dot-evolucao{fill:var(--good);stroke:var(--surface);stroke-width:2}
  .linha-evolucao-atraso{fill:none;stroke:var(--critical);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .dot-evolucao-atraso{fill:var(--critical);stroke:var(--surface);stroke-width:2}

  .tabela-titulo{font-family:"Archivo",sans-serif;font-weight:600;font-size:.78rem;color:var(--ink-soft);margin:22px 0 8px}
  /* essa tabela é só Região+Total — não estica pra largura toda do card, senão o número fica
     longe do nome da região; abraça o próprio conteúdo, tanto na tela quanto na impressão */
  .regiao-resumo{overflow-x:auto;max-width:100%}
  .regiao-resumo table.tabela-entrega{width:auto;min-width:420px;font-size:.8rem}
  .regiao-resumo table.tabela-entrega th,.regiao-resumo table.tabela-entrega td{padding:7px 12px}
  .linha-clicavel{cursor:pointer}
  .linha-clicavel:hover{background:var(--ground)}
  .chip-filtro{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-weight:600;font-size:.7rem;background:var(--blue-bg,#e9f0f3);color:var(--series-previsto);padding:2px 9px;border-radius:12px}
  .chip-inline{display:inline-block;font-weight:700;font-size:.9em;background:var(--blue-bg,#e9f0f3);color:var(--series-previsto);padding:1px 8px;border-radius:10px}
  .linha-filtro{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:"Archivo",sans-serif;font-weight:600;font-size:.8rem;color:var(--ink-soft);margin:0 0 14px}
  .linha-filtro button{font:inherit;font-size:.72rem;border:0;background:none;color:var(--series-previsto);cursor:pointer;text-decoration:underline}
  .chip-filtro button{font:inherit;font-size:.68rem;border:0;background:none;color:inherit;cursor:pointer;padding:0;text-decoration:underline}
  .tabela-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:8px}
  table.tabela-entrega{border-collapse:collapse;width:100%;font-size:.71rem}
  table.tabela-entrega th,table.tabela-entrega td{text-align:left;padding:5px 8px;border-top:1px solid var(--hair);white-space:nowrap}
  table.tabela-entrega th{font-family:"Archivo",sans-serif;font-size:.66rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface);position:sticky;top:0;border-top:0}
  table.tabela-entrega th.sortable{cursor:pointer;user-select:none}
  table.tabela-entrega th.sortable:hover{color:var(--ink)}
  table.tabela-entrega th.sortable.active{color:var(--ink)}
  table.tabela-entrega th .arrow{display:inline-block;width:.8em;font-size:.7rem;opacity:.35}
  table.tabela-entrega th .arrow.active{opacity:1;color:var(--series-previsto)}
  table.tabela-entrega td:first-child{color:var(--ink);font-weight:500;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  table.tabela-entrega tbody tr:hover{background:var(--ground)}
  table.tabela-entrega .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
  table.tabela-entrega .atraso-late{color:var(--critical);font-weight:700}
  table.tabela-entrega .atraso-ok{color:var(--good)}
  table.tabela-entrega .pendente{color:var(--ink-faint)}

  .loading,.empty-msg{padding:30px 0;text-align:center;color:var(--ink-faint);font-size:.85rem}
  .updated{margin-top:20px;text-align:right;font-size:.71rem;color:var(--ink-faint)}

  @media (max-width:700px){
    .stat-row{grid-template-columns:1fr}
  }

  @media print{
    @page{
      size:A4 portrait; margin:9mm;
      @bottom-right{ content:"página " counter(page) " de " counter(pages); font-family:Arial,sans-serif; font-size:8px; color:#888; }
    }
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
    :root{--shadow:none}
    /* a tabela usa rem em toda parte, que é relativo ao <html>, não ao <body> — por isso o encolhimento
       de fonte pra impressão precisa ir no html, senão o font-size do body sozinho não afeta nada */
    html{font-size:10.5px}
    body{background:#fff}
    .wrap{max-width:100%;padding:0}
    .tagline,.nav-voltar{display:none!important}
    /* controls (empresa/período) agora SAI impresso — ela quer ver qual representada e prazo
       estão selecionados no papel, só a busca e o "atualizando..." não fazem sentido no PDF */
    .busca-cliente,.statusbar,.btn-imprimir-icone{display:none!important}
    /* relatório pra diretoria de UMA representada não pode nem mostrar que existe outra — só o
       botão já selecionado (CIAPLAC ou BNZ) aparece impresso; os outros (e "Total") somem */
    .seg.empresa button:not(.on){display:none!important}
    section.card{box-shadow:none;border:1px solid #ccc}
    .chip-filtro button{display:none}
    /* em vez de deixar o container de rolagem horizontal desenhar a barra de scroll
       (que fica presa no PDF) se ainda sobrar alguma coisa, corta o overflow limpo aqui */
    .chart-wrap,.tabela-wrap{overflow-x:hidden}
    table.tabela-entrega th,table.tabela-entrega td{padding:3px 5px}
    /* razão social completa do cliente toma espaço demais no papel — trunca com "..." só na impressão,
       pra sobrar largura pra nome fantasia/região/efetivo/atraso aparecerem inteiros */
    table.tabela-entrega td:first-child{max-width:80px;overflow:hidden;text-overflow:ellipsis}
  }
</style>
<style id="print-page-style"></style>
</head>
<body>

<div class="wrap">
  <a href="../" class="nav-voltar">← Indicadores</a>
  <header class="masthead">
    <h1>Indicadores <span>— Prazo de Entrega</span></h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="btn-imprimir" class="btn-imprimir-icone" onclick="window.print()" title="Imprimir / Salvar PDF">🖨️</button>
      <div class="meta" id="hoje">—</div>
    </div>
  </header>
  <p class="tagline">Indicadores ao vivo — página cresce conforme novos indicadores forem adicionados.</p>

  <section class="card" id="card-entrega">
    <div class="controls">
      <div class="seg empresa" id="seg-empresa">
        <!-- representadas sempre em ordem alfabetica do nome cadastrado na Odoo; abre na primeira; Total por ultimo -->
        <button data-emp="BNZ METAIS" class="on">BNZ</button>
        <button data-emp="CIAPLAC">CIAPLAC</button>
        <button data-emp="">Total</button>
      </div>
      <div class="seg" id="seg-periodo">
        <button data-per="mes" class="on">Mês atual</button>
        <button data-per="3">Últ. 3 meses</button>
        <button data-per="6">Últ. 6 meses</button>
        <button data-per="12">Últ. 12 meses</button>
      </div>
      <div class="seg meses" id="seg-meses"></div>
      <input type="text" id="busca-cliente" class="busca-cliente" placeholder="🔎 Buscar cliente… (separe por vírgula p/ vários)">
      <div class="statusbar" id="statusbar">carregando…</div>
    </div>
    <h2>Indicador de Entregas — Prazo x Real</h2>

    <div id="entrega-body">
      <div class="loading" id="entrega-loading">carregando indicador… (pode levar até 30s)</div>
    </div>
  </section>

  <p class="updated">Indicadores - Prazo de Entrega · atualizado em <span id="updated-at">—</span></p>
</div>

<script>
const WEBHOOK_URL = "https://auto.ialink.com.br/webhook/painel-diretoria-entrega";

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function parseISOLocal(s){
  const [y,m,d] = String(s).slice(0,10).split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDateBR(s){
  if(!s) return '—';
  const d = parseISOLocal(s);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

let TODOS_PEDIDOS = [];
// Complementar/Troca ainda sem entrega: ficam fora das métricas de prazo, mas contam nos pendentes
// (pendente = tudo que falta entregar, de qualquer tipo de pedido)
let PENDENTES_EXTRAS = [];
const pedidosParaPendentes = () => TODOS_PEDIDOS.concat(PENDENTES_EXTRAS);
let empresa = 'BNZ METAIS'; // abre na primeira representada (ordem alfabetica); Total fica por ultimo
let periodo = 'mes';
let filtroRegiao = null;
let filtroSoPendentes = false;
let filtroCurvaA = false;
let filtroForaPrazo = false;
let buscaCliente = '';
let sortEntrega = { col:'data_pedido', dir:-1 };

function limparFiltroTabela(){
  filtroRegiao = null;
  filtroSoPendentes = false;
  filtroCurvaA = false;
  filtroForaPrazo = false;
  buscaCliente = '';
  const inp = $('#busca-cliente'); if(inp) inp.value = '';
  renderEntrega();
}

// Busca por cliente é independente do Período (é uma consulta pontual, não um recorte do
// relatório) — olha os 12 meses inteiros carregados, só respeitando a Empresa selecionada.
// Separado por vírgula = mais de um cliente na mesma busca (ex: "gonelli, joaquim") — casa se
// bater com QUALQUER um dos termos.
function termosBusca(termo){
  return (termo||'').split(',').map(t => t.trim()).filter(Boolean);
}
function filtrarPorCliente(termo){
  const termos = termosBusca(termo).map(t => t.toLowerCase());
  if(!termos.length) return [];
  return pedidosParaPendentes().filter(p => (!empresa || p.empresa === empresa) &&
    termos.some(t => ((p.cliente||'').toLowerCase().includes(t)) || ((p.fantasia||'').toLowerCase().includes(t)))
  ).sort((a,b) => b.data_pedido < a.data_pedido ? -1 : (b.data_pedido > a.data_pedido ? 1 : 0));
}

function renderResumoCliente(lista){
  const comEfetivo = lista.filter(p => p.efetivo);
  const atrasados = comEfetivo.filter(p => p.atraso_dias > 0);
  const noPrazo = comEfetivo.length - atrasados.length;
  // Só conta como "ainda sem entrega" pedido recente (a partir de 01/08) — pedido antigo sem
  // effective_date é falta de registro histórico, não pendência de verdade (mesmo critério
  // já usado no card "Pedidos Pendentes" — ver DATA_INICIO_CONTROLE_ENTREGA/ehPendenteConfiavel).
  const pendentes = lista.filter(p => ehPendenteConfiavel(p)).length;
  // Atraso médio = só entre quem atrasou de verdade — cada entrega é um evento isolado, não dá pra
  // misturar com quem chegou adiantado (senão um atraso grave fica escondido pela média).
  const atrasoMedio = atrasados.length ? atrasados.reduce((s,p) => s + p.atraso_dias, 0) / atrasados.length : null;
  const pct = comEfetivo.length ? Math.round(100*noPrazo/comEfetivo.length) : null;
  return `<div class="resumo-cliente">
    <span>${lista.length} pedido(s) encontrado(s)</span>
    ${pct!=null?`<span class="good">${pct}% no prazo</span><span class="critical">${100-pct}% atrasado</span>`:''}
    ${atrasoMedio!=null?`<span class="critical">Atraso médio: +${Math.round(atrasoMedio)}d (${atrasados.length})</span>`:''}
    ${pendentes?`<span>${pendentes} ainda sem entrega</span>`:''}
  </div>`;
}

const PERIODO_LABEL = { mes:'no Mês Atual', '3':'nos Últimos 3 Meses', '6':'nos Últimos 6 Meses', '12':'nos Últimos 12 Meses' };
const MESES_LABEL = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let mesesSelecionados = new Set();

// Rótulo do período atual: se ela marcou meses específicos (ex: Jul + Ago), usa isso em vez do
// relativo (Mês atual/3/6/12 meses) — os dois são mutuamente exclusivos.
function labelPeriodoAtual(){
  // Busca por cliente ignora o período (olha os 12 meses inteiros) — mostrar "no Mês Atual" nesse
  // caso é enganoso (parece que só considerou o mês, quando na real pegou tudo).
  if(buscaCliente) return 'nos Últimos 12 Meses';
  if(mesesSelecionados.size){
    return 'em ' + Array.from(mesesSelecionados).sort((a,b)=>a-b).map(m=>MESES_LABEL[m]).join(' + ');
  }
  return PERIODO_LABEL[periodo];
}

// Deixa os botões de Período/Meses "apagados" (sem o "on") quando a busca de cliente tá ativa —
// eles não valem nada nesse modo, e ficar destacado dava a entender (errado) que o filtro
// de data ainda tava agindo.
function sincronizarBotoesPeriodo(){
  // Meses específicos e período relativo (Mês atual/Últ. X meses) são mutuamente exclusivos - sem o
  // "!mesesSelecionados.size" aqui, todo re-render repintava "Mês atual" de azul por cima da seleção
  // de meses, porque a variável `periodo` continua valendo "mes" nos bastidores mesmo quando ela clica
  // em meses específicos (só quem manda de verdade é mesesSelecionados, mas o botão não refletia isso).
  $$('#seg-periodo button').forEach(x => x.classList.toggle('on', !buscaCliente && !mesesSelecionados.size && x.dataset.per === periodo));
  $$('#seg-meses button').forEach(x => x.classList.toggle('on', !buscaCliente && mesesSelecionados.has(Number(x.dataset.mes))));
}

function businessDaysBetween(d1, d2){
  let count = 0;
  const cur = new Date(d1.getTime());
  while(cur < d2){
    cur.setDate(cur.getDate()+1);
    const dow = cur.getDay();
    if(dow!==0 && dow!==6) count++;
  }
  return count;
}

// Meses específicos selecionados (ano corrente) tomam prioridade sobre o período relativo —
// ela pode marcar Jul+Ago pra comparar só esses dois meses, por exemplo.
function passaNoPeriodo(d){
  if(mesesSelecionados.size){
    return d.getFullYear() === new Date().getFullYear() && mesesSelecionados.has(d.getMonth());
  }
  const hoje = new Date();
  let desde;
  if(periodo === 'mes'){ desde = new Date(hoje.getFullYear(), hoje.getMonth(), 1); }
  else { desde = new Date(hoje.getFullYear(), hoje.getMonth() - Number(periodo), hoje.getDate()); }
  return d >= desde;
}

// Entregas REALIZADAS dentro do período (baseado na data de ENTREGA, não na data do pedido —
// "quantas entregas aconteceram em agosto", não "quantos pedidos emiti em agosto").
function filtrarEntregasRealizadas(){
  return TODOS_PEDIDOS.filter(p => {
    if(empresa && p.empresa !== empresa) return false;
    if(!p.efetivo) return false;
    return passaNoPeriodo(parseISOLocal(p.efetivo));
  });
}

function filtrarPedidos(){
  return TODOS_PEDIDOS.filter(p => {
    if(empresa && p.empresa !== empresa) return false;
    return passaNoPeriodo(parseISOLocal(p.data_pedido));
  }).sort((a,b) => a.data_pedido < b.data_pedido ? -1 : (a.data_pedido > b.data_pedido ? 1 : 0));
}

// Linha própria (fora dos cards) mostrando o recorte ativo (Região OU busca de cliente, um ou mais) —
// tirado de dentro do título do card porque com mais de um cliente buscado não cabia direito, e
// mesmo com um só passava despercebido em texto liso. Chip azul igual o da Lista completa, bem visível
// tanto na tela quanto no papel impresso.
function renderLinhaFiltro(){
  if(filtroRegiao) return `<p class="linha-filtro">Filtrando região: <span class="chip-inline">${filtroRegiao}</span> <button onclick="limparFiltroTabela()">✕ limpar</button></p>`;
  if(buscaCliente){
    const termos = termosBusca(buscaCliente);
    if(!termos.length) return '';
    return `<p class="linha-filtro">Filtrando cliente${termos.length>1?'s':''}: ${termos.map(t=>`<span class="chip-inline">"${t}"</span>`).join(' ')} <button onclick="limparFiltroTabela()">✕ limpar</button></p>`;
  }
  return '';
}

// Card Curva A: SEMPRE aparece, independente de busca/região ativa — ela quer cobrar a fábrica
// pelos melhores clientes mesmo sem estar pesquisando ninguém especificamente. Por isso recebe
// `realizadasBase` (só Empresa+Período, sem o recorte de região/busca de cliente).
function renderCurvaACard(realizadasBase){
  const curvaA = realizadasBase.filter(p => p.curva_a);
  const total = curvaA.length;
  const noPrazo = curvaA.filter(p => p.atraso_dias <= 0).length;
  const foraPrazo = total - noPrazo;
  const pctNoPrazo = total ? Math.round(100*noPrazo/total) : 0;
  const pctForaPrazo = total ? 100 - pctNoPrazo : 0;
  // Mesmo nome/explicação do card "Principais Clientes" já usado no Copiloto de Vendas — ela foi
  // explícita que o texto tem que ficar igual entre os dois apps.
  // Percentual sempre junto do próprio rótulo, numa pílula colorida (mesma estética do stat-badge
  // usado nos outros cards) — não um badge solto lá em cima, nem texto colorido sem "moldura".
  return `
      <div class="stat" data-goto-curvaa style="cursor:pointer">
        <span class="k">Principais Clientes</span>
        <div class="curva-a-linhas">
          <span class="linha"><span class="pill good">${pctNoPrazo}%</span> No Prazo</span>
          <span class="linha"><span class="pill critical">${pctForaPrazo}%</span> Fora do Prazo</span>
        </div>
        <span class="note">Curva A · top 20% dos clientes (12m) · ${total} entrega${total===1?'':'s'}<br><span style="color:var(--series-previsto);font-weight:600">toque para ver na lista ↗</span></span>
      </div>`;
}

const fmtBRLp = n => Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
function renderStatsNovos(realizadas, pendentesQtd, realizadasBase, pendentesValor){
  const total = realizadas.length;
  const noPrazo = realizadas.filter(p => p.atraso_dias <= 0);
  const foraPrazo = realizadas.filter(p => p.atraso_dias > 0);
  const pctNoPrazo = total ? Math.round(100*noPrazo.length/total) : 0;
  const pctForaPrazo = total ? Math.round(100*foraPrazo.length/total) : 0;
  // Atraso médio = média só de QUEM ATRASOU (atraso_dias > 0), não mistura com quem chegou adiantado.
  // Cada entrega é um evento isolado pro cliente — misturar os dois faria um atraso grave (+19d)
  // ser "escondido" por vários adiantamentos, dando a falsa impressão de que tá tudo bem.
  const atrasoMedio = foraPrazo.length ? foraPrazo.reduce((s,p) => s + p.atraso_dias, 0) / foraPrazo.length : 0;
  // SLA prometido: só cita o número de dias quando TODOS os pedidos visíveis têm o mesmo prazo.
  // A BNZ agora varia por região (3 ou 4 dias úteis) - citar "4 dias" com pedidos de regiões
  // diferentes misturados seria enganoso, então cai no texto genérico nesse caso. Se ela filtrar
  // por uma região específica (todos com o mesmo sla_dias), volta a mostrar o número certinho.
  const todosMesmoSla = total > 0 && realizadas.every(p => p.sla_dias === realizadas[0].sla_dias);
  const slaTxt = todosMesmoSla ? `em até ${realizadas[0].sla_dias} dias úteis` : 'dentro do prazo previsto';
  const foraTxt = todosMesmoSla ? `Passaram de ${realizadas[0].sla_dias} dias úteis` : 'Fora do prazo previsto';

  return `
    <div class="stat-row">
      <div class="stat">
        <span class="k">Entregas ${labelPeriodoAtual()}</span>
        <span class="v">${total}</span>
        <span class="note">Concluídas (data de entrega dentro do período)</span>
      </div>
      <div class="stat ${foraPrazo.length?'critical':''}" ${foraPrazo.length?'data-goto-forapraz style="cursor:pointer"':''}>
        ${total?`<span class="stat-badge">${pctForaPrazo}%</span>`:''}
        <span class="k">Fora do Prazo</span>
        <span class="v">${foraPrazo.length}</span>
        <span class="note">${foraTxt}${foraPrazo.length?' · <span style="color:var(--critical);font-weight:600">toque para ver ↗</span>':''}</span>
        ${total?`<div class="stat-bar"><span style="width:${pctForaPrazo}%"></span></div>`:''}
      </div>
      <div class="stat good">
        ${total?`<span class="stat-badge">${pctNoPrazo}%</span>`:''}
        <span class="k">No Prazo</span>
        <span class="v">${noPrazo.length}</span>
        <span class="note">Entregues ${slaTxt}</span>
        ${total?`<div class="stat-bar"><span style="width:${pctNoPrazo}%"></span></div>`:''}
      </div>
      <div class="stat ${atrasoMedio>0?'critical':''}" ${foraPrazo.length?'data-goto-forapraz style="cursor:pointer"':''}>
        <span class="k">Atraso Médio</span>
        <span class="v">${atrasoMedio>0?'+':''}${Math.round(atrasoMedio)||0}d</span>
        <span class="note">Só entre os que atrasaram (${foraPrazo.length} pedido${foraPrazo.length===1?'':'s'})${foraPrazo.length?' · <span style="color:var(--critical);font-weight:600">toque para ver ↗</span>':''}</span>
      </div>
      ${renderCurvaACard(realizadasBase || realizadas)}
      <div class="stat" data-goto-pendentes style="cursor:pointer">
        <span class="k">Pedidos Pendentes</span>
        <span class="v">${pendentesQtd}</span>
        ${pendentesValor != null ? `<span class="v2">${fmtBRLp(pendentesValor)}</span>` : ''}
        <span class="note">Qualquer data, ainda sem entrega (não segue o período) · <span style="color:var(--series-previsto);font-weight:600">toque para ver ↗</span></span>
      </div>
    </div>`;
}

function renderRegiao(realizadas){
  // Não é só quantidade — ela quer comparar PERFORMANCE entre regiões (ex: Campinas x Marília),
  // então cada região traz também % no prazo e o atraso médio (só entre quem atrasou, mesmo critério
  // do card principal — não mistura com quem chegou adiantado).
  const porRegiao = {};
  realizadas.forEach(p => {
    const r = p.regiao || 'Sem região cadastrada';
    if(!porRegiao[r]) porRegiao[r] = { total:0, noPrazo:0, somaAtraso:0, qtdAtrasado:0 };
    const d = porRegiao[r];
    d.total++;
    if(p.atraso_dias > 0){ d.somaAtraso += p.atraso_dias; d.qtdAtrasado++; }
    else d.noPrazo++;
  });
  const linhas = Object.entries(porRegiao).sort((a,b) => b[1].total-a[1].total);
  if(!linhas.length) return '';
  return `
    <p class="tabela-titulo">Entregas por Região <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:0">(toque numa região pra ver os clientes)</span></p>
    <div class="tabela-wrap regiao-resumo">
      <table class="tabela-entrega">
        <thead><tr><th>Região</th><th class="num">Total</th><th class="num">% No Prazo</th><th class="num">Atraso Médio</th></tr></thead>
        <tbody>${linhas.map(([r,d]) => {
          const pct = Math.round(100*d.noPrazo/d.total);
          const atrasoTxt = d.qtdAtrasado ? `<span class="atraso-late">+${Math.round(d.somaAtraso/d.qtdAtrasado)}d</span>` : '<span class="atraso-ok">—</span>';
          return `<tr class="linha-clicavel" data-regiao="${r}"><td>${r}</td><td class="num">${d.total}</td><td class="num">${pct}%</td><td class="num">${atrasoTxt}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

function renderEvolucao(realizadas){
  // Agora é dinâmico: mostra mês a mês só o que sobrou depois do filtro de cima (Empresa, Período/Meses
  // e Região, se ela clicou uma) — ela reclamou que antes ficava sempre o ano inteiro fixo, ignorando
  // o que estava selecionado, e isso confundia ("apertei Setembro e o gráfico não mudou").
  const porMes = {};
  realizadas.forEach(p => {
    const d = parseISOLocal(p.efetivo);
    const key = d.getFullYear() + '-' + d.getMonth();
    if(!porMes[key]) porMes[key] = { total:0, noPrazo:0, ano:d.getFullYear(), mes:d.getMonth() };
    porMes[key].total++;
    if(p.atraso_dias <= 0) porMes[key].noPrazo++;
  });
  const anoAtual = new Date().getFullYear();
  const pontos = Object.keys(porMes).sort().map(k => {
    const m = porMes[k];
    return { mes: MESES_LABEL[m.mes] + (m.ano !== anoAtual ? '/' + String(m.ano).slice(2) : ''), pct: Math.round(100*m.noPrazo/m.total), total: m.total };
  }).map(p => ({...p, pctFora: 100-p.pct}));

  if(pontos.length < 2) return `<p class="tabela-titulo">Evolução da Performance de Entrega</p><div class="empty-msg">Ainda não há meses suficientes com entregas concluídas no período selecionado.</div>`;

  const W = 640, H = 220;
  const padL = 44, padR = 16, padT = 20, padB = 28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xFor = i => padL + (pontos.length===1?plotW/2:(i/(pontos.length-1))*plotW);
  const yFor = v => padT + plotH - (v/100)*plotH;

  let gridSvg = '';
  [0,50,100].forEach(v => {
    const y = yFor(v);
    gridSvg += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    gridSvg += `<text class="axis-label" x="${padL-8}" y="${y+3}" text-anchor="end">${v}%</text>`;
  });
  let xLabelsSvg = pontos.map((p,i) => `<text class="axis-label" x="${xFor(i)}" y="${H-8}" text-anchor="middle">${p.mes}</text>`).join('');

  const linhaPts = pontos.map((p,i) => `${xFor(i).toFixed(1)},${yFor(p.pct).toFixed(1)}`);
  const linha = 'M'+linhaPts.join(' L');
  const area = `M${xFor(0).toFixed(1)},${yFor(0).toFixed(1)} L${linhaPts.join(' L')} L${xFor(pontos.length-1).toFixed(1)},${yFor(0).toFixed(1)} Z`;
  const linhaForaPts = pontos.map((p,i) => `${xFor(i).toFixed(1)},${yFor(p.pctFora).toFixed(1)}`);
  const linhaFora = 'M'+linhaForaPts.join(' L');

  let dotsSvg = pontos.map((p,i) => `<circle class="dot-evolucao" cx="${xFor(i).toFixed(1)}" cy="${yFor(p.pct).toFixed(1)}" r="4"></circle>`).join('');
  let dotsForaSvg = pontos.map((p,i) => `<circle class="dot-evolucao-atraso" cx="${xFor(i).toFixed(1)}" cy="${yFor(p.pctFora).toFixed(1)}" r="4"></circle>`).join('');
  let labelsSvg = pontos.map((p,i) => `<text class="axis-label" x="${xFor(i)}" y="${(yFor(p.pct)-10).toFixed(1)}" text-anchor="middle" style="font-weight:700">${p.pct}%</text>`).join('');

  return `
    <p class="tabela-titulo">Evolução da Performance de Entrega (% de entregas por mês, no prazo x fora do prazo)</p>
    <div class="legend">
      <span><span class="dot" style="background:var(--good)"></span>No Prazo</span>
      <span><span class="dot" style="background:var(--critical)"></span>Fora do Prazo</span>
    </div>
    <div class="chart-wrap">
      <svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
        ${gridSvg}
        <path class="area-evolucao" d="${area}"/>
        <path class="linha-evolucao" d="${linha}"/>
        <path class="linha-evolucao-atraso" d="${linhaFora}"/>
        ${dotsSvg}
        ${dotsForaSvg}
        ${labelsSvg}
        ${xLabelsSvg}
      </svg>
    </div>`;
}

const COLS_ENTREGA = [
  ['cliente','Cliente','str'], ['fantasia','Nome Fantasia','str'], ['cidade','Cidade','str'], ['estado','Estado','str'],
  ['regiao','Região','str'], ['efetivo','Dt Entrega','str'], ['atraso_dias','Atraso','num'],
  ['previsto','Previsto','str'], ['data_pedido','Data Pedido','str'], ['pedido','Pedido','str']
];
function ordenarEntrega(lista){
  const colDef = COLS_ENTREGA.find(c => c[0]===sortEntrega.col);
  const tipo = colDef ? colDef[2] : 'str';
  return [...lista].sort((a,b) => {
    if(tipo==='num'){ return ((a.atraso_dias ?? -9999) - (b.atraso_dias ?? -9999)) * sortEntrega.dir; }
    return String(a[sortEntrega.col]||'').localeCompare(String(b[sortEntrega.col]||''),'pt-BR') * sortEntrega.dir;
  });
}
function theadEntregaSort(){
  return '<tr>' + COLS_ENTREGA.map(c => {
    const active = sortEntrega.col===c[0];
    const arrow = active ? (sortEntrega.dir===1?'▲':'▼') : '⇅';
    const numCls = c[2]==='num' ? ' num' : '';
    return `<th class="sortable${active?' active':''}${numCls}" data-col="${c[0]}">${c[1]} <span class="arrow${active?' active':''}">${arrow}</span></th>`;
  }).join('') + '</tr>';
}

function renderTabela(pedidosOriginais){
  const pedidos = ordenarEntrega(pedidosOriginais);

  let chipFiltro = '';
  if(buscaCliente){
    chipFiltro = `<span class="chip-filtro">Cliente: ${buscaCliente} <button onclick="limparFiltroTabela()">✕ limpar</button></span>`;
  } else if(filtroSoPendentes || filtroRegiao || filtroCurvaA || filtroForaPrazo){
    const txt = filtroSoPendentes ? 'Só pedidos pendentes' : filtroCurvaA ? 'Curva A · Principais Clientes' : filtroForaPrazo ? 'Fora do Prazo' : `Região: ${filtroRegiao}`;
    chipFiltro = `<span class="chip-filtro">${txt} <button onclick="limparFiltroTabela()">✕ limpar</button></span>`;
  }
  const resumo = buscaCliente ? renderResumoCliente(pedidos) : '';

  if(!pedidos.length) return `<p class="tabela-titulo" id="tabela-completa">Lista completa ${chipFiltro}</p><div class="empty-msg">Nenhum pedido encontrado com esse filtro.</div>`;

  const linhas = pedidos.map(p => {
    let atrasoTxt = '<span class="pendente">pendente</span>';
    if(p.efetivo != null && p.atraso_dias != null){
      atrasoTxt = p.atraso_dias > 0
        ? `<span class="atraso-late">+${p.atraso_dias}d</span>`
        : `<span class="atraso-ok">${p.atraso_dias===0?'0d':p.atraso_dias+'d'}</span>`;
    }
    return `<tr>
      <td>${p.cliente||'—'}</td>
      <td>${p.fantasia||'—'}</td>
      <td>${p.cidade||'—'}</td>
      <td>${p.estado||'—'}</td>
      <td>${p.regiao||'—'}</td>
      <td>${p.efetivo ? fmtDateBR(p.efetivo) : '<span class="pendente">—</span>'}</td>
      <td class="num">${atrasoTxt}</td>
      <td>${fmtDateBR(p.previsto)}</td>
      <td>${fmtDateBR(p.data_pedido)}</td>
      <td>${p.pedido||'—'}</td>
    </tr>`;
  }).join('');
  return `
    <p class="tabela-titulo" id="tabela-completa">Lista completa (${pedidos.length} pedidos) ${chipFiltro}</p>
    ${resumo}
    <div class="tabela-wrap">
      <table class="tabela-entrega">
        <thead>${theadEntregaSort()}</thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`;
}

// Antes dessa data a Leidi não confirmava entrega (effective_date) direito no Odoo — pedido antigo sem
// esse campo não é "pendente de verdade", é só falta de registro. Vale só pro card/lista de Pedidos
// Pendentes; os outros indicadores (Fora do Prazo, No Prazo, Atraso Médio, Evolução, Região) continuam
// usando a base inteira, sem esse corte — só o pendente é dado não-confiável antes dessa data.
const DATA_INICIO_CONTROLE_ENTREGA = '2026-08-01';
const ehPendenteConfiavel = p => !p.efetivo && p.data_pedido >= DATA_INICIO_CONTROLE_ENTREGA;

// Pedidos Pendentes NÃO segue o seletor de Período (ela foi explícita: "independente do prazo que eu
// clicar" tem que mostrar TUDO que falta entregar) — só respeita a Empresa selecionada, igual a Evolução.
function todosPendentes(){
  return pedidosParaPendentes().filter(p => (!empresa || p.empresa === empresa) && ehPendenteConfiavel(p));
}

function renderEntrega(){
  sincronizarBotoesPeriodo();
  const pedidos = filtrarPedidos();
  const realizadas = filtrarEntregasRealizadas();
  // Clicar numa região OU buscar um cliente agora também recorta os cards e a Evolução (não só a Lista
  // completa) — pra comparar performance entre regiões/clientes. A tabela "Entregas por Região" continua
  // usando `realizadas` (sem esse recorte) pra ela poder ver/trocar de região. Busca de cliente ignora o
  // Período (é consulta pontual nos 12 meses inteiros, igual já era na tabela) — por isso usa
  // filtrarPorCliente() em vez de `realizadas`.
  let realizadasFiltradas = realizadas;
  if(buscaCliente) realizadasFiltradas = filtrarPorCliente(buscaCliente).filter(p => p.efetivo);
  else if(filtroRegiao) realizadasFiltradas = realizadas.filter(p => (p.regiao || 'Sem região cadastrada') === filtroRegiao);

  let pendentesLista = todosPendentes();
  if(buscaCliente) pendentesLista = filtrarPorCliente(buscaCliente).filter(p => ehPendenteConfiavel(p));
  else if(filtroRegiao) pendentesLista = pendentesLista.filter(p => (p.regiao || 'Sem região cadastrada') === filtroRegiao);
  const pendentesQtd = pendentesLista.length;
  // valor (R$) dos pendentes: soma do total dos pedidos. null se o backend ainda não manda o campo (v10 ou anterior).
  const pendentesValor = pendentesLista.some(p => p.valor != null) ? pendentesLista.reduce((s,p) => s + (p.valor || 0), 0) : null;

  // A tabela troca de BASE conforme o filtro clicado: a Lista padrão usa pedidos (filtro por data do
  // PEDIDO, dentro do período); clicar numa Região usa realizadasFiltradas (filtro por data de ENTREGA) —
  // é a mesma base que os cards/evolução usam agora, senão os números não batem. Pendentes usa
  // todosPendentes() (sem filtro de período), pra bater com o número do card.
  let baseTabela = pedidos;
  if(buscaCliente) baseTabela = filtrarPorCliente(buscaCliente);
  else if(filtroSoPendentes) baseTabela = todosPendentes();
  else if(filtroRegiao) baseTabela = realizadasFiltradas;
  else if(filtroCurvaA) baseTabela = pedidos.filter(p => p.curva_a);
  else if(filtroForaPrazo) baseTabela = realizadasFiltradas.filter(p => p.atraso_dias > 0);

  $('#entrega-body').innerHTML = renderLinhaFiltro() + renderStatsNovos(realizadasFiltradas, pendentesQtd, realizadas, pendentesValor) + renderEvolucao(realizadasFiltradas) + renderRegiao(realizadas) + renderTabela(baseTabela);
  syncPrintPageStyle();
}

// injeta empresa/período/data direto na margem nativa da página impressa (repete em toda página) —
// position:fixed não é confiável no motor de PDF do Chrome, mas @page @top-left sim (mesmo padrão do Copiloto).
// Texto em negrito/maior de propósito: se ela imprimir vários indicadores (empresas diferentes) de uma vez,
// precisa ficar óbvio de cara, folheando, qual página é de qual representada — não uma anotação discreta.
function syncPrintPageStyle(){
  const empLabel = empresa === 'BNZ METAIS' ? 'BNZ METAIS' : (empresa === 'CIAPLAC' ? 'CIAPLAC' : 'BNZ + CIAPLAC (Total)');
  const perLabel = labelPeriodoAtual() || '';
  const dataTxt = $('#updated-at')?.textContent || '';
  const cabecalho = ('Indicadores - Prazo de Entrega · ' + empLabel + ' — ' + perLabel).replace(/"/g,'\\"');
  const rodape = (dataTxt && dataTxt!=='—' ? 'atualizado ' + dataTxt : '').replace(/"/g,'\\"');
  const el = $('#print-page-style');
  if(el) el.textContent = '@media print{ @page{ '
    + '@top-left{ content:"'+cabecalho+'"; font-family:Archivo,Arial,sans-serif; font-weight:700; font-size:10.5px; color:#333; }'
    + '@bottom-left{ content:"'+rodape+'"; font-family:Arial,sans-serif; font-size:7px; color:#999; }'
    + ' } }';
}
window.addEventListener('beforeprint', syncPrintPageStyle);

// Delegação de clique: região (na tabela "Entregas por Região") e o card "Pedidos Pendentes"
// filtram a Lista completa e rolam até ela — o filtro fica até a Leidi limpar ou trocar empresa/período.
document.addEventListener('click', e => {
  const linhaRegiao = e.target.closest('[data-regiao]');
  if(linhaRegiao){
    filtroSoPendentes = false; filtroCurvaA = false; filtroForaPrazo = false; buscaCliente = ''; const inp1 = $('#busca-cliente'); if(inp1) inp1.value = '';
    filtroRegiao = linhaRegiao.dataset.regiao;
    renderEntrega();
    $('#tabela-completa')?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const cardPendentes = e.target.closest('[data-goto-pendentes]');
  if(cardPendentes){
    filtroRegiao = null; filtroCurvaA = false; filtroForaPrazo = false; buscaCliente = ''; const inp2 = $('#busca-cliente'); if(inp2) inp2.value = '';
    filtroSoPendentes = true;
    renderEntrega();
    $('#tabela-completa')?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const cardCurvaA = e.target.closest('[data-goto-curvaa]');
  if(cardCurvaA){
    filtroRegiao = null; filtroSoPendentes = false; filtroForaPrazo = false; buscaCliente = ''; const inp3 = $('#busca-cliente'); if(inp3) inp3.value = '';
    filtroCurvaA = true;
    renderEntrega();
    $('#tabela-completa')?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const cardForaPrazo = e.target.closest('[data-goto-forapraz]');
  if(cardForaPrazo){
    filtroRegiao = null; filtroSoPendentes = false; filtroCurvaA = false; buscaCliente = ''; const inp4 = $('#busca-cliente'); if(inp4) inp4.value = '';
    filtroForaPrazo = true;
    renderEntrega();
    $('#tabela-completa')?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const th = e.target.closest('table.tabela-entrega th[data-col]');
  if(th){
    const col = th.dataset.col;
    if(sortEntrega.col===col) sortEntrega.dir *= -1; else sortEntrega = { col, dir:1 };
    renderEntrega();
  }
});

$('#busca-cliente').addEventListener('input', e => {
  buscaCliente = e.target.value.trim();
  if(buscaCliente){ filtroRegiao = null; filtroSoPendentes = false; filtroCurvaA = false; filtroForaPrazo = false; }
  renderEntrega();
});
$('#busca-cliente').addEventListener('keydown', e => {
  if(e.key === 'Enter' && buscaCliente) $('#tabela-completa')?.scrollIntoView({behavior:'smooth', block:'start'});
});

async function load(){
  $('#statusbar').textContent = 'atualizando…';
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 45000);
  try{
    const r = await fetch(WEBHOOK_URL, {cache:'no-store', signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    TODOS_PEDIDOS = data.pedidos || [];
    PENDENTES_EXTRAS = data.pendentes_extras || [];
    $('#entrega-loading').hidden = true;
    $('#updated-at').textContent = fmtDateBR((data.atualizado_em||'').slice(0,10)) + ' ' + new Date(data.atualizado_em||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('#hoje').textContent = new Date().toLocaleDateString('pt-BR');
    $('#statusbar').textContent = 'ao vivo · ' + TODOS_PEDIDOS.length + ' pedidos (12 meses)';
    renderEntrega();
  }catch(err){
    clearTimeout(to);
    // TypeError = fetch nem chegou a ter resposta do servidor (sem internet, DNS, etc) - diferente
    // de um erro HTTP (que já tem resposta e cai no throw lá em cima). AbortError = passou de 45s
    // sem resposta (n8n/Odoo travado) - antes disso não existia timeout nenhum aqui, por isso
    // "atualizando…" podia ficar preso na tela pra sempre enquanto o fetch nunca resolvia.
    const semNet = err instanceof TypeError;
    const demorou = err.name === 'AbortError';
    // #entrega-loading só existe antes do primeiro renderEntrega() bem-sucedido (o innerHTML dele é
    // substituído, não só escondido) - numa falha depois disso ele já não existe mais no DOM. Sem essa
    // checagem, o .hidden/.innerHTML abaixo quebrava com erro e travava o texto do statusbar também.
    const loadingEl = $('#entrega-loading');
    if(loadingEl){
      loadingEl.hidden = false;
      loadingEl.innerHTML = (semNet ? '📡 Sem internet. Este indicador é só online — verifique sua conexão.' : demorou ? 'Demorou demais pra responder.' : 'Não consegui carregar.') + ' <button onclick="load()">Tentar de novo</button>';
    }
    $('#statusbar').textContent = semNet ? '📡 sem internet — este indicador é só online' : demorou ? 'sem resposta (timeout)' : 'erro ao carregar';
  }
}

$('#seg-empresa').addEventListener('click', e => {
  const b = e.target.closest('button[data-emp]'); if(!b) return;
  empresa = b.dataset.emp;
  filtroRegiao = null; filtroSoPendentes = false; filtroCurvaA = false; filtroForaPrazo = false;
  $$('#seg-empresa button').forEach(x => x.classList.toggle('on', x===b));
  renderEntrega();
});
$('#seg-periodo').addEventListener('click', e => {
  const b = e.target.closest('button[data-per]'); if(!b) return;
  periodo = b.dataset.per;
  mesesSelecionados.clear();
  $$('#seg-meses button').forEach(x => x.classList.remove('on'));
  filtroRegiao = null; filtroSoPendentes = false; filtroCurvaA = false; filtroForaPrazo = false;
  $$('#seg-periodo button').forEach(x => x.classList.toggle('on', x===b));
  renderEntrega();
});

// Meses do ano corrente, multi-seleção — pra comparar meses específicos (ex: Jul + Ago) em vez do
// período relativo. Só mostra até o mês atual (meses futuros não têm pedido nenhum).
(function initSegMeses(){
  const hoje = new Date();
  $('#seg-meses').innerHTML = MESES_LABEL.slice(0, hoje.getMonth()+1)
    .map((m,i) => `<button data-mes="${i}">${m}</button>`).join('');
})();
$('#seg-meses').addEventListener('click', e => {
  const b = e.target.closest('button[data-mes]'); if(!b) return;
  const m = Number(b.dataset.mes);
  if(mesesSelecionados.has(m)) mesesSelecionados.delete(m); else mesesSelecionados.add(m);
  b.classList.toggle('on', mesesSelecionados.has(m));
  $$('#seg-periodo button').forEach(x => x.classList.remove('on'));
  filtroRegiao = null; filtroSoPendentes = false; filtroCurvaA = false; filtroForaPrazo = false;
  buscaCliente = ''; const inpM = $('#busca-cliente'); if(inpM) inpM.value = '';
  renderEntrega();
});

load();
</script>
